name: ci

on:
  push:
  pull_request:

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build / test / clippy / fmt / doc
        run: |
          cargo build --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all --check
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install and select the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88
      - name: workspace builds on the declared MSRV
        run: cargo +1.88 build --workspace

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: license / advisory / bans / sources policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  naming-guard:
    name: Naming-worldview guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no enforcement / engine / I/O word names a kengen type
        run: ./scripts/naming-guard.sh
