[workspace]
resolver = "2"
members = [
    "crates/kengen",
    "crates/kengen-contract",
    "crates/kengen-governance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tacticaldoll/kengen"

[workspace.dependencies]
kengen-contract = { path = "crates/kengen-contract", version = "0.1.0" }
tianheng = "0.7.0"
